<body data-page="contract">
<script src="js/layout.js"></script>
<main>
  <section class="sec on" id="s-contract">
    <div class="ttl"><h2>Hợp đồng</h2><span class="note">Đưa 3–10 vật phẩm, nhận 1 vật phẩm trị giá 0.25×–4× tổng</span></div>
    <div class="ct-bar">
      <div class="sum"><div><small>Đã chọn</small><b id="ctN">0 / 10</b></div><div><small>Tổng giá trị</small><b id="ctSum">$0.00</b></div><div><small>Có thể nhận</small><b id="ctRange">—</b></div></div>
      <button class="btn pri big" id="ctBtn" disabled>Ký hợp đồng</button>
    </div>
    <p class="note ct-hint" id="ctHint">Chọn ít nhất 3 vật phẩm bên dưới để ký hợp đồng.</p>
    <div class="items sel" id="ctInv"></div>
  </section>
</main>
