<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaseLab – Mở hòm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/state.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/nav.js" defer></script>
<script src="js/feed.js" defer></script>
<script src="js/case.js" defer></script>
<script src="js/main.js" defer></script>
</head>
<body data-page="case">
<header>
  <a class="logo" href="index.html"><i></i>CaseLab</a>
  <nav id="nav">
    <a href="index.html" data-t="cases">Mở hòm</a>
    <a href="html/upgrade.html" data-t="upgrade">Nâng cấp</a>
    <a href="html/contract.html" data-t="contract">Hợp đồng</a>
    <a href="html/inventory.html" data-t="inv">Kho đồ</a>
  </nav>
  <div class="wallet">
    <div class="bal" id="bal">$0.00</div>
    <button class="btn pri" id="depBtn">+ Nạp tiền</button>
  </div>
</header>
<div class="feed" id="feed" aria-label="Drop trực tiếp (mô phỏng)"></div>
<main>
  <section class="sec on" id="s-case">
    <div class="ttl"><a class="back" href="index.html">← Quay lại</a><h2 id="caseName"></h2><span class="price" id="casePrice"></span></div>
    <div class="stage">
      <div id="reelBox"></div>
      <div class="ctrl">
        <div class="seg" id="cnt"><button class="on">1</button><button>2</button><button>3</button><button>4</button><button>5</button></div>
        <button class="btn pri" id="openBtn">Mở</button>
        <label class="chk"><input type="checkbox" id="fast"> Mở nhanh</label>
      </div>
    </div>
    <div class="ttl"><h2 class="h-sm">Vật phẩm trong hòm</h2></div>
    <div class="odds" id="odds"></div>
  </section>
</main>
<footer>Trang mô phỏng giải trí, không liên kết với Valve hay bất kỳ trang mở hòm nào. Tiền và vật phẩm đều ảo; dải drop phía trên là dữ liệu giả lập.</footer>

<div class="modal" id="mDep"><div class="box">
  <h2>Nạp tiền ảo</h2><p class="note">Chọn mức nạp hoặc nhập số tùy ý.</p>
  <div class="amts" id="amts"><button>5</button><button>10</button><button class="on">25</button><button>50</button><button>100</button><button>500</button></div>
  <input type="number" id="amtIn" min="0.01" step="0.01" value="25" aria-label="Số tiền">
  <div class="row actions mt16"><button class="btn" data-close>Hủy</button><button class="btn pri" id="depOk">Nạp</button></div>
</div></div>
<div class="modal" id="mWin"><div class="box">
  <h2 id="winT">Bạn nhận được</h2><p class="note" id="winS"></p>
  <div class="items" id="winItems"></div>
  <div class="row actions" id="winBtns"></div>
</div></div>
<div class="toast" id="toast"></div>
</body>
</html>
